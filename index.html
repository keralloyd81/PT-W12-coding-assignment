<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recipe Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<header class="text-center py-5" style="background: url('https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg') center/cover no-repeat; height: 400px; position: relative;">
  <div class="container d-flex flex-column justify-content-center align-items-center h-100">
      <div class="p-4 bg-white bg-opacity-75 rounded shadow">
          <h1 class="display-2 fw-bold text-dark">Discover All of Moms Tasty Recipes</h1>
          <p class="lead fs-3 fw-semibold text-dark">Just like the ones  you had as a kid</p>
      </div>
  </div>
</header>
<body class="container my-5">
  <h1 class="text-center mb-4">Momma K's Recipes</h1>

  <form id="recipeForm" class="mb-4">
    <div class="mb-3">
      <input type="text" id="recipeName" class="form-control" placeholder="Recipe Name" required>
    </div>
    <div class="mb-3">
      <textarea id="recipeIngredients" class="form-control" placeholder="Ingredients" required></textarea>
    </div>
    <div class="mb-3">
      <textarea id="recipeInstructions" class="form-control" placeholder="Instructions"></textarea>
    </div>
    <button type="submit" class="btn btn-success">Add Recipe</button>
  </form>

  <ul id="recipeList" class="list-group"></ul>

  <script src="script.js"></script>
</body>
</html>
